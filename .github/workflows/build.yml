name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The selftest downloads models here; the cache keeps them between runs.
      CI_DATA: ${{ github.workspace }}\ci-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ci-data\models
          key: shotfinder-models-${{ runner.os }}-${{ hashFiles('shotfinder/models.py') }}
          restore-keys: |
            shotfinder-models-${{ runner.os }}-

      - name: Test
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1

      - name: Audit runtime dependencies
        run: .\.venv\Scripts\python.exe tools\check_runtime_deps.py dist\ShotFinder --json dist\runtime-deps.json

      - name: Checksum the release zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ShotFinder-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw "build.ps1 did not produce a release zip" }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Extract the release zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ShotFinder-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw "build.ps1 did not produce a release zip" }
          Expand-Archive -Path $zip.FullName -DestinationPath ci-test -Force
          if (-not (Test-Path ci-test\ShotFinder\ShotFinder.exe)) {
            throw "ci-test\ShotFinder\ShotFinder.exe is missing after extraction"
          }

      - name: Selftest without Python on PATH
        shell: pwsh
        run: |
          # Prove the bundle does not rely on the build venv or an interpreter.
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and $_ -notmatch '(?i)python|\\\.venv\\|\\Scripts\\'
          }) -join ';'
          $env:PYTHONHOME = $null
          $env:PYTHONPATH = $null
          $env:VIRTUAL_ENV = $null
          $env:SHOTFINDER_MODELS_DIR = $null
          $env:SHOTFINDER_DATA_DIR = $null
          $stillPython = Get-Command python -ErrorAction SilentlyContinue
          if ($stillPython) {
            Write-Warning "python is still resolvable at $($stillPython.Source) (not the build venv); the bundle must not use it"
          }

          New-Item -ItemType Directory -Force $env:CI_DATA | Out-Null
          $exe = Join-Path $PWD "ci-test\ShotFinder\ShotFinder.exe"
          Write-Host "Running $exe --selftest $env:CI_DATA"
          $process = Start-Process -FilePath $exe `
            -ArgumentList '--selftest', $env:CI_DATA `
            -Wait -PassThru -NoNewWindow
          $report = Join-Path $env:CI_DATA "selftest-report.json"
          if (Test-Path $report) {
            Get-Content $report -Raw
          } else {
            Write-Warning "selftest did not write $report"
          }
          if ($process.ExitCode -ne 0) {
            throw "selftest failed with exit code $($process.ExitCode)"
          }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) {
            throw "selftest report says ok=false"
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShotFinder-windows
          if-no-files-found: warn
          path: |
            dist/ShotFinder-*-win64.zip
            dist/SHA256SUMS.txt
            dist/runtime-deps.json
            ci-data/selftest-report.json
